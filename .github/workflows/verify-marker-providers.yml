name: Verify marker providers

on:
  push:
    branches: [ci/marker-provider-verification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marker-provider-verification
  cancel-in-progress: true

env:
  TARGET_SHA: 345b5d50fa393b8023d9f2bdad949a0d55b06781
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  JOBS: '2'
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  swift-package:
    name: Swift package tests (Xcode 27.2)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify revision and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git remote set-url origin https://github.com/jo32/tvbox-silicon.git
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          df -h .
          mkdir -p build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package build tools
        run: brew install pkgconf
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg/*/FFmpeg.xcframework
            ~/Library/Caches/tvbox-libass/*/LibASS.xcframework
          key: apple-media-xcode27.2-${{ hashFiles('Scripts/build-apple-ffmpeg.sh', 'Scripts/build-apple-libass.sh') }}
      - name: Build original media dependencies
        shell: bash
        run: |
          set -euo pipefail
          Scripts/build-apple-ffmpeg.sh 2>&1 | tee build/ci-ffmpeg.log
          Scripts/build-apple-libass.sh 2>&1 | tee build/ci-libass.log
      - name: Run complete default Swift package test suite
        shell: bash
        run: |
          set -euo pipefail
          swift test --jobs 2 --no-parallel 2>&1 | tee build/ci-swift-tests.log
      - name: Save package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-package-evidence
          path: build/ci-*.log
          if-no-files-found: ignore
          retention-days: 14

  full-verify:
    name: Full macOS, iOS and tvOS verification
    needs: swift-package
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify revision and toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git remote set-url origin https://github.com/jo32/tvbox-silicon.git
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -showsdks
          df -h .
          mkdir -p build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
          architecture: aarch64
      - name: Install full verification tools
        run: brew install autoconf pkgconf cmake uv xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg/*/FFmpeg.xcframework
            ~/Library/Caches/tvbox-libass/*/LibASS.xcframework
          key: apple-media-xcode27.2-${{ hashFiles('Scripts/build-apple-ffmpeg.sh', 'Scripts/build-apple-libass.sh') }}
      - name: Prepare desktop hosts
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          Scripts/build-java-host.sh 2>&1 | tee build/ci-java-host.log
          Scripts/build-script-host.sh 2>&1 | tee build/ci-script-host.log
          Scripts/build-python-host.sh 2>&1 | tee build/ci-python-host.log
          df -h .
      - name: Prepare iOS static runtime
        shell: bash
        run: |
          set -euo pipefail
          Scripts/package-apple-runtime.sh ios 2>&1 | tee build/ci-runtime-ios.log
          df -h .
      - name: Prepare tvOS static runtime
        shell: bash
        run: |
          set -euo pipefail
          Scripts/package-apple-runtime.sh tvos 2>&1 | tee build/ci-runtime-tvos.log
          df -h .
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run repository full verification with its queue
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          unset VERIFY_DIRECT VERIFY_SLOT VERIFY_STARTED
          Scripts/verify.sh 2>&1 | tee build/ci-full-verify.log
      - name: Save full verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-verification-evidence
          path: |
            build/ci-*.log
            build/verify-*.log
            ~/Library/Caches/tvbox-verify/runs.log
          if-no-files-found: ignore
          retention-days: 14
